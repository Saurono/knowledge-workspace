name: CI

on:
  push:
    branches: [main, codex/knowledge-workspace-v0.1]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc (macOS)
        if: matrix.platform == 'macos-latest'
        run: brew install protobuf

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf protobuf-compiler

      - name: Install protoc (Windows)
        if: matrix.platform == 'windows-latest'
        run: choco install protoc -y

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: npm ci

      - name: Check module boundaries
        run: npm run check:modules

      - name: Check module audit snapshot
        run: npm run audit:modules:check

      - name: Check frontend build
        run: npm run typecheck && npx vite build

      - name: Check shared Web build
        run: npm run build:web

      - name: Check shared service build
        run: npm run build:service

      - name: Check shared HTTP and persistence
        run: npx vitest run server src/modules/platform src/modules/service-api src/modules/identity src/modules/ingestion analysis/evaluation/d01-acceptance.test.ts analysis/evaluation/d02-acceptance.test.ts analysis/evaluation/d02-local-import-acceptance.test.ts --exclude='**/mcp-server/**' --exclude='**/*.real-llm.test.ts'

      - name: Check shared HTTP and persistence
        run: npx vitest run server src/modules/platform src/modules/service-api src/modules/identity src/modules/ingestion analysis/evaluation/d01-acceptance.test.ts analysis/evaluation/d02-acceptance.test.ts analysis/evaluation/d02-local-import-acceptance.test.ts --exclude='**/mcp-server/**' --exclude='**/*.real-llm.test.ts'

      # 全量套件（src + server）暂时没加进 CI：2026-11-11 试过一次，windows/macos 上稳定失败的
      # 是 src/lib/ingest.scenarios.test.ts（Vault 回执同步）、src/app/obsidian/phase-receipts.real-fs.test.ts，
      # 另有一次 server/k04-e2e.test.ts 在老步骤里也抖了；这三条要单独修稳再加，
      # 卡：tools/cards/2026-11-11-flaky-tests-ci.md。加之前别在这里放 red 步骤。

      - name: Prepare MCP server resources
        run: |
          npm --prefix mcp-server ci
          npm run mcp:build

      - name: Check shared CLI and MCP authorization
        run: node analysis/implementation/smoke-shared-clients.mjs

      - name: Check Rust build
        working-directory: src-tauri
        run: cargo build

      - name: Check Rust tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Build isolated Windows acceptance executable
        if: matrix.platform == 'windows-latest'
        working-directory: src-tauri
        env:
          TAURI_CONFIG: '{"identifier":"com.llmwiki.acceptance"}'
        run: cargo build --features custom-protocol

      - name: Upload Windows debug executable
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: llm-wiki-windows-acceptance
          path: src-tauri/target/debug/llm-wiki.exe
          if-no-files-found: error
